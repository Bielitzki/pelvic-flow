<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pelvic Flow</title>

    <link rel="stylesheet" href="style.css">
    manifest.json
</head>

<body>

    <div class="container">

        <h1>🌙 Pelvic Flow</h1>

        <p class="subtitle">
            Suivi quotidien
        </p>

        <div class="card">

            <h2 id="exerciseTitle">
                Prête pour votre séance
            </h2>

            <div id="timer">
                05:00
            </div>

            <button id="startBtn">
                Commencer
            </button>

            <button id="resetBtn">
                Réinitialiser
            </button>

        </div>

        <div class="card">

            <h2>Historique</h2>

            <p>
                Séances complétées :
                <span id="historyCount">0</span>
            </p>

        </div>

    </div>

    app.jsscript>

</body>

</html>
